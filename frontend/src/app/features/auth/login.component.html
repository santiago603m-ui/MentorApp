<div class="auth-shell">
  <div class="glass auth-card anim-up">

    <header class="auth-head">
      <div class="auth-logo">
        <img src="assets/Logo.png" alt="MentorSync AI" />
      </div>
      <h1 class="auth-title">Bienvenido de vuelta</h1>
      <p class="auth-sub">Inicia sesión para continuar aprendiendo</p>
    </header>

    <form class="auth-form" (ngSubmit)="onLogin()" #loginForm="ngForm" novalidate>
      <div class="field">
        <label class="label" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="input"
          autocomplete="email"
          placeholder="tu@correo.com"
          [(ngModel)]="credentials.email"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="field">
        <label class="label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="input"
          autocomplete="current-password"
          placeholder="••••••••"
          [(ngModel)]="credentials.password"
          [disabled]="isLoading"
          required
        />
      </div>

      <p class="form-error" *ngIf="errorMessage" role="alert">
        {{ errorMessage }}
      </p>

      <button type="submit"
              class="btn btn-primary btn-lg btn-block"
              [disabled]="isLoading || loginForm.invalid">
        <span class="spinner" *ngIf="isLoading" aria-hidden="true"></span>
        {{ isLoading ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-foot">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate gratis</a>
    </p>
  </div>
</div>
